name: Release

# Builds, signs and notarizes "Claude Accounts.app", wraps it in a .dmg and attaches it to a
# draft GitHub Release in this repo.
#
# How to cut a release:
#   git tag v1.0.0
#   git push origin v1.0.0
# Review the draft under the repo's "Releases" tab and click "Publish".
# Running it by hand (Actions tab > Run workflow) does the whole build, signing and notarization
# but publishes nothing, since a branch has no version to release.
#
# Secrets (Settings > Secrets and variables > Actions):
#   MAC_CSC_LINK                    base64 of the "Developer ID Application" certificate (.p12)
#   MAC_CSC_KEY_PASSWORD            password of that .p12
#   APPLE_ID                        Apple ID of the developer account
#   APPLE_APP_SPECIFIC_PASSWORD     app-specific password for that Apple ID
#   APPLE_TEAM_ID                   10-character Team ID
#   SPARKLE_ED_PRIVATE_KEY          contents of the Sparkle EdDSA private key file (signs auto-updates)
#
# Auto-update: the app reads releases/latest/download/appcast.xml, which this workflow attaches to the
# release. GitHub only serves that URL for *published* releases, so nobody is offered an update
# until the draft is published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release notes come from the commits since the previous tag

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-manual"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # Prepared and unlocked by hand: electron-builder-style auto keychains fail on current runner images
      # ("SecKeychainUnlock: The user name or passphrase you entered is not correct").
      - name: Import code-signing certificate
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and sign
        run: scripts/build-app.sh

      - name: Notarize the app
        run: |
          set -e
          ditto -c -k --keepParent "build/Claude Accounts.app" build/app.zip
          xcrun notarytool submit build/app.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "build/Claude Accounts.app"
          rm build/app.zip

      - name: Make the dmg
        run: |
          set -e
          DMG="build/Claude-Accounts-$VERSION.dmg"
          scripts/make-dmg.sh "build/Claude Accounts.app" "$DMG"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          (cd build && shasum -a 256 "Claude-Accounts-$VERSION.dmg" > "Claude-Accounts-$VERSION.dmg.sha256")
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Appcast for auto-update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -e
          DIR=build/appcast; rm -rf "$DIR"; mkdir -p "$DIR"
          cp "$DMG" "$DIR/"
          # Release notes, shown in the update window and used as the draft's text: release-notes/<version>.md
          # if it exists, otherwise the commit subjects since the previous tag.
          NOTES="$DIR/$(basename "${DMG%.dmg}").md"
          if [ -f "release-notes/$VERSION.md" ]; then
            cp "release-notes/$VERSION.md" "$NOTES"
          else
            PREV="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            { echo "## What's new"; git log --pretty='- %s' ${PREV:+$PREV..}HEAD; } > "$NOTES"
          fi
          cp "$NOTES" build/release-notes.md
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          else
            PREFIX="https://example.invalid/"
          fi
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --embed-release-notes --download-url-prefix "$PREFIX" "$DIR"
          grep -q 'sparkle:edSignature' "$DIR/appcast.xml" || { echo "appcast has no signature"; exit 1; }
          cp "$DIR/appcast.xml" build/appcast.xml

      - name: Verify
        run: |
          set -e
          spctl --assess --type execute --verbose=2 "build/Claude Accounts.app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file build/release-notes.md \
            "$DMG" "$DMG.sha256" build/appcast.xml
